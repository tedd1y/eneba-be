; PHP-FPM pool overrides for the container. Installed as zzz-app.conf so it loads after the image's zz-docker.conf.
[global]
error_log = /proc/self/fd/2

[www]
listen = 127.0.0.1:9000

; Pass Render's env variables through to PHP, and send worker output to the container log.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
